<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Forecast App</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="weather-card">
      <h1>Weather Forecast</h1>
      <p class="subtitle">Дізнайся актуальну погоду у своєму місті</p>

      <form class="search-box" id="searchForm">
        <input
          type="text"
          id="cityInput"
          placeholder="Введіть місто..."
          required
        />
        <button type="submit">Пошук</button>
      </form>

      <div class="weather-info" id="weatherInfo">
        <img
          src="https://openweathermap.org/img/wn/01d@2x.png"
          alt="Weather icon"
          class="weather-icon"
          id="weatherIcon"
        />

        <h2 id="cityName">Kyiv</h2>
        <p class="temperature" id="temperature">24°C</p>
        <p class="description" id="description">Сонячно</p>

        <div class="details">
          <div>
            <span>Вологість</span>
            <strong id="humidity">60%</strong>
          </div>

          <div>
            <span>Вітер</span>
            <strong id="wind">4 м/с</strong>
          </div>
        </div>
      </div>

      <p class="error" id="errorMessage"></p>
    </section>
  </main>
</body>
</html>
